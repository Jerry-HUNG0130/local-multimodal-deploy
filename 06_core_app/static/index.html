<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機房與人資知識庫 (Secure RAG AI)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
    // 輕量 Markdown 渲染（不依賴外部 CDN）
    function renderMarkdown(text) {
        return text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/^### (.+)$/gm, '<h4>$1</h4>')
            .replace(/^## (.+)$/gm, '<h3>$1</h3>')
            .replace(/^# (.+)$/gm, '<h2>$1</h2>')
            .replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>')
            .replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>')
            .replace(/(<li>.*<\/li>\n?)+/gs, '<ul>$&</ul>')
            .replace(/\n{2,}/g, '<br><br>')
            .replace(/\n/g, '<br>');
    }
    </script>
    <style>
        :root {
            --bg-deep: #020617;
            --glass-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --msg-user: rgba(59, 130, 246, 0.15);
            --msg-ai: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            margin: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.3);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: pulse 2s infinite;
        }

        .chat-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* 隱藏滾動條但保持功能 */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .message {
            max-width: 82%;
            padding: 18px 24px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 1rem;
            animation: floatIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
            word-wrap: break-word;
        }

        .ai-message {
            align-self: flex-start;
            background: var(--msg-ai);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .user-message {
            align-self: flex-end;
            background: var(--msg-user);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .context-box {
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #8b5cf6;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-sub);
            display: none;
        }

        /* Markdown 渲染樣式 */
        .ai-message p { margin: 0.4em 0; }
        .ai-message strong { color: #93c5fd; }
        .ai-message code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .ai-message ul, .ai-message ol { padding-left: 1.5em; margin: 0.4em 0; }
        .ai-message li { margin: 0.2em 0; }
        .context-box p { margin: 0.3em 0; }
        .context-box strong { color: #c4b5fd; }
        .context-box code { background: rgba(255,255,255,0.08); padding: 1px 4px; border-radius: 3px; }

        .input-section {
            padding: 24px 32px;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid var(--glass-border);
        }

        .input-wrapper {
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.05rem;
            padding: 12px 16px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 0 28px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #2563eb;
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: translateY(1px);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 24px;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.9rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes floatIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Local-AI Secure RAG</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            Model: LLaVA (Offline)
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message ai-message">
            你好！我是已內建 11 份公司機密規章（包含機房SOP、人資請假辦法等）的專屬 AI 系統。因為採全本地端運算，您的對話絕對安全，且不曾傳送至海外。<br><br>請問您想查詢哪方面的規章問題呢？
        </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
        ✦ AI 正在檢索機房與人資向量資料庫...
    </div>

    <div class="input-section">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="例如：發現伺服器機櫃亮起紅燈，SOP 第一步是什麼？" onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">發送檢索</button>
        </div>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');

    function appendMessage(sender, text, context = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-message`;
        
        // Markdown 渲染（AI 回答）或純文字（使用者）
        if (sender === 'ai') {
            msgDiv.innerHTML = renderMarkdown(text);
        } else {
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
        }

        // 如果是 AI 回答且有參考資料，附加上去
        if (context && context.trim() !== '') {
            const ctxDiv = document.createElement('div');
            ctxDiv.className = 'context-box';
            ctxDiv.style.display = 'block';
            ctxDiv.innerHTML = `<strong>來自內部資料庫的參考依據：</strong><br>` + renderMarkdown(context);
            msgDiv.appendChild(ctxDiv);
        }

        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. 顯示使用者訊息
        appendMessage('user', text);
        userInput.value = '';
        
        // 2. 顯示讀取中動畫
        typingIndicator.style.display = 'block';
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            // 3. 呼叫本地端的 FastAPI RAG 介面
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text })
            });

            if (!response.ok) throw new Error("伺服器回應異常");

            const data = await response.json();
            typingIndicator.style.display = 'none';
            
            // 4. 顯示 AI 產生的答案與參考規章
            appendMessage('ai', data.answer, data.context_used);

        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMessage('ai', '⚠️ 抱歉，後端 RAG 引擎遇到連線異常，請確認 FastAPI 及 Ollama 是否成功運行中。');
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
